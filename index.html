<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halftype — procedural typography</title>
    <meta
      name="description"
      content="Type a word and get it back in twenty-two generative pattern styles, one to a page in a ring binder you turn. Export every variation as SVG, PNG, MP4 or GIF."
    />

    <!-- The mark is the word set in one of the app's own styles: the letter h
         in Blocks, which is the thing this makes. An SVG favicon because it is
         geometry rather than a photograph of geometry, so it is crisp at every
         size a browser asks for and one file covers all of them. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0b0d" />

    <meta property="og:title" content="Halftype" />
    <meta
      property="og:description"
      content="Type a word and get it back in twenty-two generative pattern styles."
    />
    <meta property="og:type" content="website" />
    <!-- PNG rather than the SVG the rest of this uses: X, Slack and Facebook
         all refuse SVG for a link preview. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
